    "title": "Academic Planning",
    "version": "0.5.0",
    "description": "Única fuente de escritura moderna; sólo sesión institucional activa. Catálogos: planning.catalogs.manage; semestres, laboratorios y días inhábiles: planning.manage. Mutaciones auditadas y reautorizadas. PATCH recibe el formulario completo. No hay borrado físico. Horarios semanales y disponibilidad institucional bajo planning.manage; consultas activas sin reserva."
