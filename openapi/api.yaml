          name: X-XSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
          description: 'Token CSRF de la misma sesión.'
      responses:
        201:
          description: 'Operación autorizada completada.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        401:
          $ref: './management.yaml#/components/responses/Problem'
        403:
          $ref: './management.yaml#/components/responses/Problem'
        409:
          $ref: './management.yaml#/components/responses/Problem'
        419:
          $ref: './management.yaml#/components/responses/Problem'
        422:
          $ref: './management.yaml#/components/responses/Problem'
        default:
          $ref: './management.yaml#/components/responses/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
