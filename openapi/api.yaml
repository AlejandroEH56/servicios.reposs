            - string
            - 'null'
          maxLength: 40
        givenNames:
          type: string
          maxLength: 160
        firstSurname:
          type: string
          maxLength: 120
        secondSurname:
          type:
            - string
            - 'null'
          maxLength: 120
        isAdviser:
