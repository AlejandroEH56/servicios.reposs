name: ${COMPOSE_PROJECT_NAME:-servicios_stage}
x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: servicios-backend:${RELEASE_SHA:-local}
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  volumes:
    - private_storage:/srv/app/storage/app/private
  networks: [internal]
  environment:
    APP_DEBUG: "false"
    LOG_CHANNEL: stderr
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${MYSQL_DATABASE:-servicios_moderno_stage}
    SESSION_DRIVER: database
    SESSION_COOKIE: laravel_session
    SESSION_SECURE_COOKIE: "true"
    SESSION_HTTP_ONLY: "true"
    SESSION_SAME_SITE: lax
    CACHE_STORE: database
    MODERNIZATION_OPERATIONS_ENABLED: "false"
    OTEL_ENABLED: "true"
    OTEL_LOG_LEVEL: none
    OTEL_EXPORTER_OTLP_ENDPOINT: http://172.30.0.3:4318
    PRIVATE_STORAGE_ROOT: /srv/app/storage/app/private
services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql.Dockerfile
    image: servicios-mysql:${RELEASE_SHA:-local}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-servicios_moderno_stage}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_ROOT_HOST: "%"
    secrets:
      - mysql_root_password
      - source: initialize_users
        target: /docker-entrypoint-initdb.d/initialize-users.sql
    volumes: [mysql_data:/var/lib/mysql]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 15
  backend:
    <<: *backend
    env_file: ${RUNTIME_ENV_FILE:-.tools/environments/container-runtime.env}
    depends_on:
      mysql:
        condition: service_healthy
  grant-runtime:
    image: servicios-mysql:${RELEASE_SHA:-local}
    profiles: [maintenance]
    networks: [internal]
    secrets: [mysql_root_password]
    configs:
      - source: grant_runtime
        target: /grant-runtime.sql
    entrypoint: [bash, -c]
    command: ['export MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)"; exec mysql --host=mysql --user=root < /grant-runtime.sql']
    depends_on:
      mysql:
        condition: service_healthy
  worker:
    <<: *backend
    env_file: ${RUNTIME_ENV_FILE:-.tools/environments/container-runtime.env}
    command: [php, artisan, outbox:work, --no-interaction]
    depends_on:
      mysql:
        condition: service_healthy
  migrator:
    <<: *backend
    restart: "no"
    profiles: [maintenance]
    env_file: ${MIGRATOR_ENV_FILE:-.tools/environments/container-migrator.env}
    command: [php, artisan, migrate, --force, --no-interaction]
    depends_on:
      mysql:
        condition: service_healthy
  proxy:
    build:
      context: .
      dockerfile: docker/proxy.Dockerfile
    image: servicios-proxy:${RELEASE_SHA:-local}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-https://localhost:8443}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE:-tls internal}
      CANONICAL_ORIGIN: ${CANONICAL_ORIGIN:-https://localhost:8443}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
      - "${HOST_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes: [caddy_data:/data, caddy_config:/config]
    networks:
      internal:
        ipv4_address: 172.30.0.2
    depends_on: [backend]
  antivirus:
    build:
      context: .
      dockerfile: docker/antivirus.Dockerfile
    image: servicios-antivirus:${RELEASE_SHA:-local}
    restart: unless-stopped
    volumes: [clamav_data:/var/lib/clamav]
    networks: [internal]
  collector:
    image: otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    restart: unless-stopped
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./docker/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel_data:/var/otel
    networks:
      internal:
        ipv4_address: 172.30.0.3
  initialize-volumes:
    image: servicios-backend:${RELEASE_SHA:-local}
    profiles: [maintenance]
    user: "0:0"
    entrypoint: [sh, -c]
    command: ['chown -R www-data:www-data /srv/app/storage/app/private && chown -R 10001:10001 /var/otel']
    volumes: [private_storage:/srv/app/storage/app/private, otel_data:/var/otel]
    network_mode: none
secrets:
  mysql_root_password:
    file: ${MYSQL_ROOT_PASSWORD_FILE:-.tools/environments/mysql-root-password.txt}
  initialize_users:
    file: .tools/environments/initialize-users.sql
configs:
  grant_runtime:
    file: .tools/environments/grant-runtime.sql
networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
volumes:
  mysql_data:
  private_storage:
  caddy_data:
  caddy_config:
  clamav_data:
  otel_data:
