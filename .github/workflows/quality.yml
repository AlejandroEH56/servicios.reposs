name: Modernization quality
on:
  pull_request:
  push:
    branches: [main, master, 'modernization/**']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4.27'
          extensions: pdo_sqlite, pdo_mysql, mbstring, openssl, gd
          tools: composer:2.10.3
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: php vendor/bin/phpunit
        env:
          S8_PDF_POPPLER: '1'
      - run: composer analyse
      - run: composer audit --locked
  frontend-openapi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run openapi:lint
      - run: npm run openapi:bundle
      - run: npm run api:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm audit
      - run: npm audit
        working-directory: frontend
      - run: npm run test:gate
      - run: git diff --exit-code

# MySQL, Docker and security/contract checks live in integration.yml; the release gate also requires operational evidence.
