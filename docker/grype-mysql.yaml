    namespace: oracle:distro:oraclelinux:9
    reason: FIPS epoch 10 channel mismatch; installed gnutls release 9 contains release 4 security backports.
    package:
      name: ^gnutls$
      version: 3.8.10-9.el9_8
      type: rpm
