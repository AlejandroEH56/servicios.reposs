components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: laravel_session
      description: 'Nombre del ambiente local APP_NAME=Laravel. Configurar SESSION_COOKIE para otros ambientes y actualizar contrato.'
  schemas:
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Identity'
    Identity:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - email
        - status
        - roles
        - permissions
        - scopes
        - sessionExpiresAt
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        displayName:
          type: string
          maxLength: 255
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 254
        status:
          type: string
          enum:
            - PENDIENTE
            - ACTIVA
            - SUSPENDIDA
            - DESACTIVADA
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        sessionExpiresAt:
          type: string
          format: date-time
    PermissionGrant:
      type: object
      additionalProperties: false
      required:
        - permissionId
        - code
        - scope
      properties:
        permissionId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        code:
          type: string
          maxLength: 160
        scope:
          type: string
          enum:
            - SELF
            - GLOBAL
    Permission:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - allowedScopes
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        code:
          type: string
          maxLength: 160
        allowedScopes:
          type: array
          items:
            type: string
            enum:
              - SELF
              - GLOBAL
    Role:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - version
        - permissions
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        code:
          type: string
          maxLength: 100
        name:
          type: string
          maxLength: 160
        version:
          type: integer
          minimum: 1
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGrant'
    AuthorizationIdentity:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - status
        - authorizationVersion
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        displayName:
          type: string
          maxLength: 255
        status:
          type: string
          enum:
            - PENDIENTE
            - ACTIVA
            - SUSPENDIDA
            - DESACTIVADA
        authorizationVersion:
          type: integer
          minimum: 1
    IdentityCandidate:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - status
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        displayName:
          type: string
          maxLength: 255
        status:
          type: string
          enum:
            - PENDIENTE
            - ACTIVA
            - SUSPENDIDA
            - DESACTIVADA
    AssignedRole:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - expiresAt
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        code:
          type: string
          maxLength: 100
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
    RoleChange:
      type: object
      additionalProperties: false
      required:
        - id
        - roleId
        - action
        - occurredAt
        - authorizationVersion
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        roleId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        action:
          type: string
          enum:
            - GRANTED
            - REVOKED
        occurredAt:
          type: string
          format: date-time
        authorizationVersion:
          type: integer
          minimum: 1
    RoleAssignments:
      type: object
      additionalProperties: false
      required:
        - identityId
        - authorizationVersion
        - roles
        - history
      properties:
        identityId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        authorizationVersion:
          type: integer
          minimum: 1
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AssignedRole'
        history:
          type: array
          items:
            $ref: '#/components/schemas/RoleChange'
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          type: string
          maxLength: 100
          pattern: '^[A-Z][A-Z0-9_]*$'
        name:
          type: string
          maxLength: 160
    ReplaceRolePermissionsRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - permissions
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        permissions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - permissionId
              - scope
            properties:
              permissionId:
                type: string
                pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
              scope:
                type: string
                enum:
                  - SELF
                  - GLOBAL
          maxItems: 100
    RoleAssignmentRequest:
      type: object
      additionalProperties: false
      required:
        - expectedAuthorizationVersion
      properties:
        expectedAuthorizationVersion:
          type: integer
          minimum: 1
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
    OrganizationUnit:
      type: object
      additionalProperties: false
      required:
        - id
        - parentId
        - code
        - name
        - kind
        - active
        - version
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        parentId:
          type:
            - string
            - 'null'
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        code:
          type: string
          maxLength: 60
        name:
          type: string
          maxLength: 180
        kind:
          type: string
          maxLength: 40
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
    AcademicLevel:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - rank
        - version
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        code:
          type: string
          maxLength: 40
        name:
          type: string
          maxLength: 100
        rank:
          type: integer
          minimum: 1
          maximum: 65535
        version:
          type: integer
          minimum: 1
    PositionAssignment:
      type: object
      additionalProperties: false
      required:
        - id
        - unitId
        - unitName
        - name
        - source
        - sourceOrder
        - startsOn
        - endsOn
        - active
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        unitId:
          type:
            - string
            - 'null'
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        unitName:
          type:
            - string
            - 'null'
          maxLength: 180
        name:
          type: string
          maxLength: 180
        source:
          type: string
          enum:
            - MICROSOFT_JOBTITLE
            - MANUAL
            - MIGRACION
        sourceOrder:
          type:
            - integer
            - 'null'
          minimum: 1
        startsOn:
          type: string
          format: date
        endsOn:
          type:
            - string
            - 'null'
          format: date
        active:
          type: boolean
    AcademicDegree:
      type: object
      additionalProperties: false
      required:
        - id
        - levelId
        - levelName
        - program
        - abbreviation
        - obtainedOn
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        levelId:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        levelName:
          type: string
          maxLength: 100
        program:
          type: string
          maxLength: 255
        abbreviation:
          type:
            - string
            - 'null'
          maxLength: 45
        obtainedOn:
          type:
            - string
            - 'null'
          format: date
    ExpectedVersionRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    OrganizationEmployee:
      type: object
      additionalProperties: false
      required:
        - id
        - identityId
        - employeeNumber
        - givenNames
        - firstSurname
        - secondSurname
        - isAdviser
        - email
        - status
        - version
        - profileVersion
        - positions
        - degrees
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        identityId:
          type:
            - string
            - 'null'
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        employeeNumber:
          type:
            - string
            - 'null'
          maxLength: 40
        givenNames:
          type: string
          maxLength: 160
        firstSurname:
          type: string
          maxLength: 120
        secondSurname:
          type:
            - string
            - 'null'
          maxLength: 120
        isAdviser:
          type: boolean
        email:
          type:
            - string
            - 'null'
          format: email
        status:
          type: string
          enum:
            - ACTIVO
            - EN_LICENCIA
            - INACTIVO
            - ARCHIVADO
        version:
          type: integer
          minimum: 1
        profileVersion:
          type: integer
          minimum: 0
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionAssignment'
        degrees:
          type: array
          items:
            $ref: '#/components/schemas/AcademicDegree'
    InternalAdviser:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - positions
        - degrees
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        displayName:
          type: string
          maxLength: 402
        positions:
          type: array
