              "type": "string",
              "maxLength": 4096
            },
            "description": "Token preparado mediante /sanctum/csrf-cookie."
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,100}$"
            },
            "description": "Reintentos reautorizados, misma carga y clave durante 24 horas. Una clave reservada/en proceso, fallida, vencida o con payload distinto devuelve 409."
          }
        ],
        "responses": {
          "201": {
            "description": "Resultado privado sin caché.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "maxLength": 50
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EvidenceResponse"
                }
              }
            }
          },
