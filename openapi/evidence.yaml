      "post": {
        "operationId": "stageResidencyEvidence",
        "summary": "Preparar archivo privado vinculado a residente, requisito y proyecto opcional; 10 MB, MIME real y antivirus. La ruta de carga de Publicaciones conserva su contrato previo.",
        "tags": [
          "Evidence"
        ],
        "security": [
          {
            "session": []
          }
        ],
        "parameters": [
          {
            "name": "X-XSRF-TOKEN",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 4096
            },
            "description": "Token preparado mediante /sanctum/csrf-cookie."
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,100}$"
            },
            "description": "Reintentos reautorizados, misma carga y clave durante 24 horas. Una clave reservada/en proceso, fallida, vencida o con payload distinto devuelve 409."
