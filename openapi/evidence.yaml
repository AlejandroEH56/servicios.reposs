    "description": "Expediente y revisión documental. Historial append-only, archivos privados escaneados y preparados con vencimiento de 24 h; reserva previa para reintentos. No hay eliminación automática de documentos, cuarentena ni historial. Máximo 100 preparaciones por actor en 24 h y throttle 10/min. Reportes, liberación y emisión corresponden al Sprint 8."
  },
