openapi: 3.1.1
info:
  title: 'Servicios - API'
  version: 0.4.0
  description: 'Identidad, autorización local y Organization desplegados. Permisos y alcances se evalúan en el servidor; ningún puesto Microsoft concede roles.'
  license:
    name: MIT
    identifier: MIT
servers:
  -
    url: ''
    description: 'Mismo origin que Laravel. SPA separada requiere topología y CORS aprobados.'
security:
  -
    session: []
tags:
  -
    name: IAM
    description: 'Identidad institucional y sesión local, sin tokens Microsoft.'
  -
    name: Organization
    description: 'Empleados confirmados, puestos, grados y estructura organizacional.'
  -
    name: Publications
    description: 'Avisos, vigencias e imágenes privadas escaneadas.'
  -
    name: AcademicPlanning
    description: 'Catálogos, semestres, laboratorios y días inhábiles.'
paths:
  /api/v1/academic-planning/responsibles:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1responsibles
  /api/v1/academic-planning/catalogs/{catalog}:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1catalogs~1{catalog}
  /api/v1/academic-planning/catalogs/{catalog}/{record}:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1catalogs~1{catalog}~1{record}
  /api/v1/academic-planning/semesters:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1semesters
  /api/v1/academic-planning/semesters/{record}:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1semesters~1{record}
  /api/v1/academic-planning/laboratories:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1laboratories
  /api/v1/academic-planning/laboratories/{record}:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1laboratories~1{record}
  /api/v1/academic-planning/holidays:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1holidays
  /api/v1/academic-planning/holidays/{record}:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1holidays~1{record}
  /api/v1/academic-planning/semesters/{record}/activate:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1semesters~1{record}~1activate
  /api/v1/academic-planning/semesters/{record}/close:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1semesters~1{record}~1close
  /api/v1/academic-planning/semesters/{record}/archive:
    $ref: ./academic-planning.yaml#/paths/~1api~1v1~1academic-planning~1semesters~1{record}~1archive
  /api/v1/public/notices:
    $ref: ./publications.yaml#/paths/~1api~1v1~1public~1notices
  /api/v1/public/notices/{notice}:
    $ref: ./publications.yaml#/paths/~1api~1v1~1public~1notices~1{notice}
  /api/v1/publications/notices:
    $ref: ./publications.yaml#/paths/~1api~1v1~1publications~1notices
  /api/v1/publications/notices/{notice}:
    $ref: ./publications.yaml#/paths/~1api~1v1~1publications~1notices~1{notice}
  /api/v1/publications/notices/{notice}/publish:
    $ref: ./publications.yaml#/paths/~1api~1v1~1publications~1notices~1{notice}~1publish
  /api/v1/publications/notices/{notice}/withdraw:
    $ref: ./publications.yaml#/paths/~1api~1v1~1publications~1notices~1{notice}~1withdraw
  /api/v1/files/staged:
    $ref: ./publications.yaml#/paths/~1api~1v1~1files~1staged
  /api/v1/files/{file}/download:
    $ref: ./publications.yaml#/paths/~1api~1v1~1files~1{file}~1download
  /api/v1/public/notices/{notice}/images/{file}:
    $ref: ./publications.yaml#/paths/~1api~1v1~1public~1notices~1{notice}~1images~1{file}
  /sanctum/csrf-cookie:
    get:
      operationId: prepareCsrf
      summary: 'Inicializar protección CSRF de la sesión'
      description: 'Emite XSRF-TOKEN para mutaciones del mismo origen. Angular lo envía como X-XSRF-TOKEN; no contiene credenciales Microsoft.'
      tags:
        - IAM
      security: []
      responses:
        204:
          description: 'Cookie CSRF inicializada, sin cuerpo.'
        400:
          description: 'Solicitud HTTP malformada.'
        default:
          description: 'Error de inicialización.'
  /auth/entra/logout:
    post:
      operationId: logoutSession
      summary: 'Cerrar la sesión local'
      description: 'Requiere cookie de sesión y X-XSRF-TOKEN de esa misma sesión. Invalida la sesión y rota CSRF. No ejecuta logout federado.'
      tags:
        - IAM
      parameters:
        -
          name: X-XSRF-TOKEN
          in: header
          required: true
          schema:
            type: string
      responses:
        204:
          description: 'Sesión invalidada, sin cuerpo.'
        401:
          $ref: './management.yaml#/components/responses/Problem'
        419:
          $ref: './management.yaml#/components/responses/Problem'
        default:
          $ref: './management.yaml#/components/responses/Problem'
  /api/v1/me:
    get:
      operationId: getMe
      summary: 'Obtener identidad de la sesión activa'
      description: 'Requiere cookie Laravel, identidad ACTIVA y sesión vigente. No acepta bearer tokens Microsoft. No almacena caché.'
      tags:
        - IAM
      parameters:
        -
          $ref: './management.yaml#/components/parameters/CorrelationId'
      responses:
        200:
          description: 'Identidad y autorizaci?n local efectiva de la sesi?n actual.'
          headers:
            X-Correlation-ID:
              $ref: './management.yaml#/components/headers/CorrelationId'
            Cache-Control:
              description: 'Respuesta privada de sesión, sin almacenamiento en caché.'
              schema:
                type: string
                const: 'no-store, private'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        401:
          $ref: './management.yaml#/components/responses/Problem'
        default:
          $ref: './management.yaml#/components/responses/Problem'
  /api/v1/iam/roles:
    get:
      operationId: listRoles
