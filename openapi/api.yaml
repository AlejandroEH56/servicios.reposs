        code:
          type: string
          maxLength: 60
          pattern: '^[A-Z0-9_\-]+$'
        name:
          type: string
          maxLength: 180
        kind:
          type: string
          maxLength: 40
        active:
          type: boolean
    UpdateUnitRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - code
        - name
        - kind
        - active
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        parentId:
          type:
            - string
            - 'null'
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
        code:
          type: string
          maxLength: 60
          pattern: '^[A-Z0-9_\-]+$'
        name:
          type: string
          maxLength: 180
        kind:
          type: string
          maxLength: 40
        active:
          type: boolean
    CreateLevelRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - rank
      properties:
        code:
          type: string
          maxLength: 40
          pattern: '^[A-Z0-9_\-]+$'
        name:
