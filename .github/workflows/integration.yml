name: Modernization integration
on:
  pull_request:
  push:
    branches: ['modernization/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:26.7.0@sha256:9d48c42f8341068f199116dfccb919b607c99765b5c61e549a548a43033471a4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: servicios_moderno_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: ci-test-only
      DB_DATABASE: servicios_moderno_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4.26'
          extensions: pdo_mysql, pdo_sqlite, mbstring, openssl
          tools: composer:2.10.3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: mkdir -p artifacts && php vendor/bin/phpunit -c phpunit.mysql.xml --log-junit artifacts/mysql.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mysql-${{ github.sha }}
          path: artifacts/*.xml
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Compose with official checksum
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl --fail --location https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 -o /tmp/docker-compose-linux-x86_64
          curl --fail --location https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64.sha256 -o /tmp/docker-compose-linux-x86_64.sha256
          (cd /tmp && sha256sum --check --strict docker-compose-linux-x86_64.sha256)
          install -m 755 /tmp/docker-compose-linux-x86_64 "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4.26'
          extensions: pdo_sqlite, pdo_mysql, mbstring, openssl
          tools: composer:2.10.3
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - run: composer install --no-interaction --prefer-dist --no-scripts && npm ci --ignore-scripts
      - name: Prepare isolated synthetic environment
        shell: pwsh
        run: |
          $lines = @('APP_NAME=Servicios','APP_ENV=staging','APP_DEBUG=false','APP_KEY=base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=','APP_URL=https://localhost:8443','DB_CONNECTION=mysql','DB_DATABASE=servicios_moderno_stage','SESSION_DRIVER=database','CACHE_STORE=database','LOG_CHANNEL=stderr','MICROSOFT_TENANT_ID=11111111-1111-4111-8111-111111111111','MICROSOFT_CLIENT_ID=22222222-2222-4222-8222-222222222222','MICROSOFT_CLIENT_SECRET=synthetic-ci-only','MICROSOFT_ATLOS_USER_GROUP_ID=33333333-3333-4333-8333-333333333333','MICROSOFT_REDIRECT_URI=https://localhost:8443/auth/microsoft/callback')
          [IO.File]::WriteAllLines((Join-Path $PWD '.env.staging'),$lines)
          ./scripts/prepare-compose.ps1
      - name: Build from locks and run Linux suite
        run: |
          mkdir -p artifacts/docker-tls
          chmod 777 artifacts
          docker build --target test -f docker/backend.Dockerfile -t servicios-tests:${GITHUB_SHA} .
          docker run --rm --network none -e APP_ENV=testing -v "$PWD/artifacts:/srv/app/artifacts" servicios-tests:${GITHUB_SHA} php vendor/bin/phpunit --log-junit artifacts/linux.xml
          docker compose --env-file docker/environment.example build --provenance=mode=max backend proxy mysql antivirus
      - name: Start private topology and migrate
        run: |
          docker compose --env-file docker/environment.example up -d mysql
          docker compose --env-file docker/environment.example run --rm migrator
          docker compose --env-file docker/environment.example run --rm grant-runtime
          docker compose --env-file docker/environment.example run --rm initialize-volumes
          docker compose --env-file docker/environment.example up -d backend worker proxy collector antivirus
          for i in $(seq 1 60); do if docker cp servicios_stage-proxy-1:/data/caddy/pki/authorities/local/root.crt artifacts/docker-tls/root.crt 2>/dev/null; then break; fi; sleep 1; done
          test -s artifacts/docker-tls/root.crt
          sudo cp artifacts/docker-tls/root.crt /usr/local/share/ca-certificates/servicios-stage.crt
          sudo update-ca-certificates
      - name: TLS, browser and service failures
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/artifacts/docker-tls/root.crt
          E2E_CA_FILE: artifacts/docker-tls/root.crt
          E2E_ENVIRONMENT: docker
          RUN_DOCKER_TESTS: '1'
        run: |
          for i in $(seq 1 60); do if docker compose --env-file docker/environment.example exec -T antivirus clamdscan --ping 1; then break; fi; sleep 2; done
          npx playwright install --with-deps chromium
          npm run test:tls
          npm run test:e2e
          php vendor/bin/phpunit tests/Integration/DockerOperationalTest.php --log-junit artifacts/docker-operational.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: docker-${{ github.sha }}
          path: artifacts/*.xml
      - run: docker compose --env-file docker/environment.example down
        if: always()
  security-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install pinned tools with release checksums
        run: |
          mkdir -p .tools/quality artifacts
          install_tool() {
            repo="$1"; version="$2"; asset="$3"; checksum="$4"
            curl --fail --location "https://github.com/$repo/releases/download/v$version/$asset" -o ".tools/quality/$asset"
            curl --fail --location "https://github.com/$repo/releases/download/v$version/$checksum" -o .tools/quality/checksums.txt
            (cd .tools/quality && grep " $asset$" checksums.txt | sha256sum --check --strict)
            tar -xzf ".tools/quality/$asset" -C .tools/quality
          }
          install_tool anchore/syft 1.54.1 syft_1.54.1_linux_amd64.tar.gz syft_1.54.1_checksums.txt
          install_tool anchore/grype 0.120.1 grype_0.120.1_linux_amd64.tar.gz grype_0.120.1_checksums.txt
          install_tool gitleaks/gitleaks 8.30.1 gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_checksums.txt
          install_tool oasdiff/oasdiff 1.33.0 oasdiff_1.33.0_linux_amd64.tar.gz checksums.txt
      - name: Contract, secrets and SAST
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="$(git merge-base HEAD origin/main)"; fi
          mkdir -p artifacts/contract-base
          git archive "$base" openapi | tar -x -C artifacts/contract-base
          .tools/quality/oasdiff breaking artifacts/contract-base/openapi/api.yaml openapi/api.yaml --fail-on ERR --format json > artifacts/openapi-breaking.json
          .tools/quality/gitleaks git --redact --no-banner --report-format json --report-path artifacts/secrets.json
          docker run --rm --network none -v "$PWD:/src:ro" semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 semgrep scan --oss-only --timeout 15 --max-memory 256 --jobs 2 --config /src/.semgrep.yaml --metrics=off --error --json /src/app /src/frontend/src > artifacts/sast.json
      - name: Image SBOM and vulnerability gate
        run: |
          for name in backend proxy mysql antivirus; do
            docker build --provenance=mode=max -f docker/$name.Dockerfile -t servicios-$name:${GITHUB_SHA} .
          done
          docker pull otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
          [[ "$(date -u +%F)" < 2026-11-08 ]] || { echo 'MySQL classification review expired'; exit 1; }
          result=0
          for name in backend proxy mysql antivirus collector; do
            image="servicios-$name:${GITHUB_SHA}"
            if [ "$name" = collector ]; then image="otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1"; fi
            docker save -o artifacts/$name.tar "$image"
            .tools/quality/syft docker-archive:artifacts/$name.tar -o syft-json=artifacts/$name-sbom.json -o cyclonedx-json=artifacts/$name-cyclonedx.json
            args=()
            if [ "$name" = mysql ]; then args=(--config docker/grype-mysql.yaml); fi
            .tools/quality/grype "${args[@]}" sbom:artifacts/$name-sbom.json --fail-on high -o json > artifacts/$name-image-scan.json || result=1
            rm artifacts/$name.tar
          done
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: quality-${{ github.sha }}
          path: |
            artifacts/*.json
            artifacts/*.yaml