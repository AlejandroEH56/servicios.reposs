    namespace: oracle:distro:oraclelinux:9
    reason: FIPS epoch 10 channel mismatch; non-FIPS OpenSSL 3.5.8 contains January 2026 fixes.
    package:
      name: ^openssl$
      version: 1:3.5.8-1.0.1.el9_8
      type: rpm
  - vulnerability: ELSA-2026-50075
    namespace: oracle:distro:oraclelinux:9
    reason: FIPS epoch 10 channel mismatch; non-FIPS OpenSSL 3.5.8 contains January 2026 fixes.
    package:
      name: ^openssl-libs$
      version: 1:3.5.8-1.0.1.el9_8
      type: rpm
