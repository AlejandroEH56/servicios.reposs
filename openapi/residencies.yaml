    "description": "Migración funcional con datos nuevos. Cada proyecto es exclusivo por residente/periodo; fechas inclusivas no se solapan entre proyectos no cancelados. Empresa global con RFC único. Sin fusión, evidencias, reportes, liberaciones ni emisión en este sprint. Mutaciones reautorizadas bajo bloqueo transaccional y auditadas. Sin borrado físico."
  },
